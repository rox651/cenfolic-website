name: Deploy to Hostinger

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [wordpress_content_update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: bun x puppeteer browsers install chrome

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Debug SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ]; then
            echo "SSH_HOST secret is empty"
            exit 1
          fi
          if [ -z "$SSH_PORT" ]; then
            echo "SSH_PORT secret is empty"
            exit 1
          fi
          echo "Checking SSH connectivity..."
          nc -vz -w 20 "$SSH_HOST" "$SSH_PORT"

      - name: Add known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 30 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "pwd"

      - name: Download existing audio files from Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Descargando archivos de audio existentes de Hostinger..."
          mkdir -p public/audio
          rsync -avz -e "ssh -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/cenfolic.com/public_html/audio/" \
            public/audio/ 2>/dev/null || echo "No hay archivos de audio existentes o error al descargar"
          
          if [ -d "public/audio" ] && [ "$(ls -A public/audio 2>/dev/null)" ]; then
            echo "✓ Archivos de audio descargados:"
            find public/audio -type f -name "*.mp3" | head -10
            echo "Total de archivos MP3 descargados: $(find public/audio -type f -name "*.mp3" | wc -l)"
            echo "Total de hashes heredados descargados: $(find public/audio -type f -name "*.hash" | wc -l)"
          else
            echo "⚠️  No se encontraron archivos de audio existentes"
          fi

      - name: Download existing post images from Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Descargando imágenes existentes de Hostinger..."
          mkdir -p public/images
          rsync -avz --include='*/' --include='*.png' --exclude='*' \
            -e "ssh -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/cenfolic.com/public_html/images/" \
            public/images/ 2>/dev/null || echo "No hay imágenes existentes o error al descargar"

      - name: Download existing content hashes from Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Descargando hashes de contenido existentes de Hostinger..."
          mkdir -p public/content-hashes
          rsync -avz -e "ssh -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/cenfolic.com/public_html/content-hashes/" \
            public/content-hashes/ 2>/dev/null || echo "No hay hashes de contenido existentes"

      - name: Build project
        run: |
          set -euo pipefail
          if [ -z "$OPEN_AI_KEY" ]; then
            echo "⚠️  WARNING: OPEN_AI_KEY no está configurada"
          else
            echo "✓ OPEN_AI_KEY está configurada (longitud: ${#OPEN_AI_KEY})"
          fi
          bun run build
        env:
          OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
          MAX_MEDIA_CHANGES: "3"

      - name: Copy audio files to dist
        run: |
          if [ -d "public/audio" ]; then
            echo "Copiando archivos de audio de public/audio a dist/audio..."
            mkdir -p dist/audio
            cp -r public/audio/* dist/audio/ 2>/dev/null || true
            echo "✓ Archivos de audio copiados"
            find dist/audio -type f -name "*.mp3" | head -10
            echo "Total de archivos MP3 en dist: $(find dist/audio -type f -name "*.mp3" | wc -l)"
          else
            echo "⚠️  Directorio public/audio NO existe - no hay archivos de audio para copiar"
          fi

      - name: Copy content hashes to dist
        run: |
          if [ -d "public/content-hashes" ]; then
            mkdir -p dist/content-hashes
            cp -r public/content-hashes/. dist/content-hashes/
          fi

      - name: Upload dist folder to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz -e "ssh -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
            dist/ \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/cenfolic.com/public_html/"
