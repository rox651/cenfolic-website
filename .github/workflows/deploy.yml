name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [wordpress-update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: |
          if [ -z "$OPEN_AI_KEY" ]; then
            echo "⚠️  WARNING: OPEN_AI_KEY no está configurada"
          else
            echo "✓ OPEN_AI_KEY está configurada (longitud: ${#OPEN_AI_KEY})"
          fi
          bun run build
        env:
          OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload dist folder to Hostinger
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/cenfolic.com/public_html/


